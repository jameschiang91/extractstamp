<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="./logo32.png">
  <title>印章提取器</title>
  <script src="./extractstamp.js" onerror="window.__extractStampScriptError = true"></script>
  <style>
    body { max-width: 960px; margin: 2rem auto; padding: 0 1rem; font: 16px system-ui, sans-serif; color: #222; }
    label { display: inline-block; margin: .5rem 1rem .5rem 0; }
    #status { margin: 1rem 0; padding: .75rem; border-radius: 6px; background: #eef4ff; }
    #status.error { background: #fff0f0; color: #a00000; }
    .hint { color: #555; font-size: .9rem; }
    .grid { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 1rem; }
    .grid img { max-width: min(420px, 100%); max-height: 420px; object-fit: contain; border: 1px solid #ddd; }
    button { padding: .55rem 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <h1>印章提取器</h1>
  <p>纯前端处理：图片只在当前浏览器中处理，不会上传到服务器。</p>
  <label>图片：<input type="file" id="imageInput" accept="image/*"></label>
  <label>颜色：<select id="color"><option value="auto" selected>自动/蓝紫色</option><option value="blue">蓝色</option><option value="red">红色</option><option value="green">绿色</option><option value="purple">紫色/灰紫色</option></select></label>
  <label>形状：<select id="shape"><option value="ellipse" selected>椭圆/自动裁剪</option><option value="none">不裁剪</option></select></label>
  <label>清理：<select id="cleanup"><option value="strict" selected>严格清理（推荐）</option><option value="balanced">保留浅色印泥</option></select></label>
  <label>输出：<select id="outputMode"><option value="original" selected>保留原色</option><option value="custom">统一颜色</option></select></label>
  <label>统一颜色：<input id="outputColor" type="color" value="#0000ff"></label>
  <button id="download" type="button" disabled>下载结果</button>
  <div id="status" role="status">正在加载本地图像处理引擎…</div>
  <p class="hint">背景文字较多时，请保持“严格清理”；印泥很浅或残缺时再尝试“保留浅色印泥”。</p>
  <h2>原图</h2><div id="original" class="grid"></div>
  <h2>提取结果</h2><div id="result" class="grid"></div>
  <script>
    const status = document.getElementById('status');
    const input = document.getElementById('imageInput');
    const download = document.getElementById('download');
    const outputMode = document.getElementById('outputMode');
    const outputColor = document.getElementById('outputColor');
    let latestResult = null;
    let originalUrl = null;

    const setStatus = (message, error = false) => {
      status.textContent = message;
      status.classList.toggle('error', error);
    };
    const updateOutputControl = () => {
      outputColor.disabled = outputMode.value === 'original';
    };
    const showOriginal = (file) => {
      if (originalUrl) URL.revokeObjectURL(originalUrl);
      originalUrl = URL.createObjectURL(file);
      const image = document.createElement('img');
      image.src = originalUrl;
      image.alt = '原图';
      const container = document.getElementById('original');
      container.innerHTML = '';
      container.appendChild(image);
    };
    async function startApp() {
      if (window.__extractStampScriptError || typeof initOpenCV !== 'function') {
        setStatus('处理脚本加载失败，请刷新页面后重试。', true);
        return;
      }
      try {
        await initOpenCV();
        setStatus('处理引擎已就绪，请选择图片。');
      } catch (error) {
        setStatus(error.message || '处理引擎初始化失败，请刷新后重试。', true);
      }
    }

    updateOutputControl();
    outputMode.addEventListener('change', updateOutputControl);
    startApp();

    input.addEventListener('change', async () => {
      const file = input.files[0];
      if (!file) return;
      showOriginal(file);
      document.getElementById('result').innerHTML = '';
      download.disabled = true;
      latestResult = null;
      setStatus('正在提取并清理背景…');
      try {
        const color = outputMode.value === 'original' ? 'original' : outputColor.value;
        const images = await extractStampWithFile(
          file,
          color,
          document.getElementById('color').value,
          document.getElementById('shape').value,
          document.getElementById('cleanup').value,
        );
        if (!images.length) throw new Error('未找到符合条件的印章。请先尝试“保留浅色印泥”或选择更准确的颜色。');
        latestResult = images[0];
        const result = document.getElementById('result');
        images.forEach((src, index) => {
          const image = document.createElement('img');
          image.src = src;
          image.alt = '提取结果 ' + (index + 1);
          result.appendChild(image);
        });
        download.disabled = false;
        setStatus('提取完成。');
      } catch (error) {
        console.error(error);
        setStatus('处理失败：' + (error.message || error), true);
      }
    });
    download.addEventListener('click', () => {
      if (!latestResult) return;
      const link = document.createElement('a');
      link.href = latestResult;
      link.download = 'stamp.png';
      link.click();
    });
  </script>
</body>
</html>
