<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="./logo32.png">
  <title>印章提取器</title>
  <script>
    let engineReadyPromise;
    const COLOR_RANGES = {
      red: [{ min: 0, max: 22 }, { min: 338, max: 360 }],
      blue: [{ min: 180, max: 275 }],
      green: [{ min: 70, max: 180 }],
      purple: [{ min: 260, max: 338 }],
    };
    function initOpenCV(callback) {
      if (!engineReadyPromise) {
        engineReadyPromise = Promise.resolve().then(() => { callback?.(true); return true; });
      }
      return engineReadyPromise;
    }
    function hexToRgb(hex) {
      const value = String(hex || '#0000ff').replace('#', '');
      const normalized = value.length === 3 ? value.split('').map((c) => c + c).join('') : value;
      return [parseInt(normalized.slice(0, 2), 16) || 0, parseInt(normalized.slice(2, 4), 16) || 0, parseInt(normalized.slice(4, 6), 16) || 0];
    }
    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b), delta = max - min;
      let hue = 0;
      if (delta) {
        if (max === r) hue = 60 * (((g - b) / delta) % 6);
        else if (max === g) hue = 60 * ((b - r) / delta + 2);
        else hue = 60 * ((r - g) / delta + 4);
      }
      if (hue < 0) hue += 360;
      return [hue, max ? delta / max : 0, max];
    }
    function isTargetPixel(r, g, b, color) {
      const [hue, saturation, value] = rgbToHsv(r, g, b);
      if (saturation < 0.16 || value < 0.10) return false;
      return (COLOR_RANGES[color] || COLOR_RANGES.blue).some(({ min, max }) => hue >= min && hue <= max);
    }
    function extractStampWithFile(file, setColor = '#0000ff', color = 'blue', shape = 'ellipse') {
      return new Promise((resolve, reject) => {
        if (!file) { reject(new Error('请选择图片文件。')); return; }
        const img = new Image(), objectUrl = URL.createObjectURL(file);
        img.onload = () => {
          try {
            const canvas = document.createElement('canvas');
            canvas.width = img.naturalWidth || img.width; canvas.height = img.naturalHeight || img.height;
            const context = canvas.getContext('2d', { willReadFrequently: true });
            if (!context) throw new Error('浏览器不支持 Canvas 图像处理。');
            context.drawImage(img, 0, 0);
            const image = context.getImageData(0, 0, canvas.width, canvas.height);
            const { data, width, height } = image;
            let left = width, top = height, right = -1, bottom = -1;
            for (let y = 0; y < height; y += 1) for (let x = 0; x < width; x += 1) {
              const index = (y * width + x) * 4;
              if (!isTargetPixel(data[index], data[index + 1], data[index + 2], color)) continue;
              if (x < left) left = x; if (x > right) right = x; if (y < top) top = y; if (y > bottom) bottom = y;
            }
            if (right < left || bottom < top) { resolve([]); return; }
            const padding = shape === 'ellipse' ? Math.max(2, Math.round(Math.max(right - left, bottom - top) * 0.04)) : 0;
            const bounds = { left: Math.max(0, left - padding), top: Math.max(0, top - padding), width: Math.min(width, right + padding + 1) - Math.max(0, left - padding), height: Math.min(height, bottom + padding + 1) - Math.max(0, top - padding) };
            const output = new Uint8ClampedArray(bounds.width * bounds.height * 4);
            const [red, green, blue] = hexToRgb(setColor);
            let matched = 0;
            for (let y = 0; y < bounds.height; y += 1) for (let x = 0; x < bounds.width; x += 1) {
              const sourceIndex = ((bounds.top + y) * width + bounds.left + x) * 4, targetIndex = (y * bounds.width + x) * 4;
              if (!isTargetPixel(data[sourceIndex], data[sourceIndex + 1], data[sourceIndex + 2], color)) continue;
              output[targetIndex] = red; output[targetIndex + 1] = green; output[targetIndex + 2] = blue; output[targetIndex + 3] = 255; matched += 1;
            }
            if (!matched) { resolve([]); return; }
            const resultCanvas = document.createElement('canvas'); resultCanvas.width = bounds.width; resultCanvas.height = bounds.height;
            resultCanvas.getContext('2d').putImageData(new ImageData(output, bounds.width, bounds.height), 0, 0);
            resolve([resultCanvas.toDataURL('image/png')]);
          } catch (error) { reject(error instanceof Error ? error : new Error(String(error))); }
          finally { URL.revokeObjectURL(objectUrl); }
        };
        img.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error('图片加载失败，请换一张图片。')); };
        img.src = objectUrl;
      });
    }
    window.initOpenCV = initOpenCV;
    window.extractStampWithFile = extractStampWithFile;
  </script>
  <style>
    body { max-width: 960px; margin: 2rem auto; padding: 0 1rem; font: 16px system-ui, sans-serif; color: #222; }
    label { display: inline-block; margin: .5rem 1rem .5rem 0; }
    #status { margin: 1rem 0; padding: .75rem; border-radius: 6px; background: #eef4ff; }
    #status.error { background: #fff0f0; color: #a00000; }
    .grid { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 1rem; }
    .grid img { max-width: min(420px, 100%); max-height: 420px; object-fit: contain; border: 1px solid #ddd; }
    button { padding: .55rem 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <h1>印章提取器</h1>
  <p>纯前端处理：图片不会上传到服务器。</p>
  <label>图片：<input type="file" id="imageInput" accept="image/*"></label>
  <label>颜色：<select id="color"><option value="blue" selected>蓝色</option><option value="red">红色</option><option value="green">绿色</option><option value="purple">紫色</option></select></label>
  <label>形状：<select id="shape"><option value="ellipse" selected>椭圆/自动裁剪</option><option value="none">不裁剪</option></select></label>
  <label>输出颜色：<input id="outputColor" type="color" value="#0000ff"></label>
  <button id="download" type="button" disabled>下载结果</button>
  <div id="status" role="status">正在初始化处理引擎…</div>
  <h2>原图</h2><div id="original" class="grid"></div>
  <h2>提取结果</h2><div id="result" class="grid"></div>
  <script>
    const status = document.getElementById('status');
    const input = document.getElementById('imageInput');
    const download = document.getElementById('download');
    let latestResult = null;
    const setStatus = (message, error = false) => { status.textContent = message; status.classList.toggle('error', error); };
    const showOriginal = (file) => { const url = URL.createObjectURL(file); const image = document.createElement('img'); image.src = url; image.alt = '原图'; const container = document.getElementById('original'); container.innerHTML = ''; container.appendChild(image); };
    const startApp = () => {
      if (window.__extractStampScriptError || typeof initOpenCV !== 'function') {
        setStatus('处理脚本加载失败，请刷新页面后重试。', true);
        return;
      }
      initOpenCV()
        .then(() => setStatus('处理引擎已就绪，请选择图片。'))
        .catch((e) => setStatus(e.message, true));
    };

    if (document.readyState === 'complete') {
      startApp();
    } else {
      window.addEventListener('load', startApp, { once: true });
    }
    input.addEventListener('change', async () => {
      const file = input.files[0]; if (!file) return;
      showOriginal(file); document.getElementById('result').innerHTML = ''; download.disabled = true; latestResult = null; setStatus('处理中…');
      try {
        const images = await extractStampWithFile(file, document.getElementById('outputColor').value, document.getElementById('color').value, document.getElementById('shape').value);
        if (!images.length) throw new Error('未找到符合条件的印章，请调整颜色或换一张更清晰的图片。');
        latestResult = images[0]; const result = document.getElementById('result'); result.innerHTML = ''; images.forEach((src, i) => { const image = document.createElement('img'); image.src = src; image.alt = '提取结果 ' + (i + 1); result.appendChild(image); }); download.disabled = false; setStatus('提取完成。');
      } catch (e) { console.error(e); setStatus('处理失败：' + (e.message || e), true); }
    });
    download.addEventListener('click', () => { if (!latestResult) return; const a = document.createElement('a'); a.href = latestResult; a.download = 'stamp.png'; a.click(); });
  </script>
</body>
</html>
