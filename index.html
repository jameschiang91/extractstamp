<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提取印章 · 实验归档版</title>
<script async src="./opencv.js" onerror="window.openCvLoadError = true"></script>
<script src="./extractstamp.js"></script>
<script src="./colorstamp.js"></script>
<style>
body{font:16px/1.6 system-ui,sans-serif;color:#25313c;background:#f5f6f8;max-width:1100px;margin:24px auto;padding:0 20px}
h1{margin-bottom:4px}h2{font-size:20px}p{margin:8px 0}.muted{color:#606975}fieldset{border:1px solid #ccd2da;border-radius:10px;background:white;padding:18px;margin:18px 0}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0}input,select,button{font:inherit}button,select,input[type=text],input[type=number]{padding:7px 10px;border:1px solid #aeb9c4;border-radius:5px}button{cursor:pointer;background:#fff}button:disabled{cursor:default;opacity:.5}#processButton{background:#245bb0;color:white}
input[type=text]{width:100px}input[type=number]{width:65px}#status{padding:12px;background:#e8eef8;border-radius:7px;white-space:pre-wrap}#sourceCanvas{max-width:100%;height:auto;background:white;touch-action:manipulation}#imageContainer{display:flex;flex-wrap:wrap;gap:20px}figure{margin:0;max-width:100%}figure img{display:block;max-width:100%;max-height:550px;object-fit:contain;background:repeating-conic-gradient(#e3e3e3 0% 25%,white 0% 50%) 0/18px 18px;border:1px solid #ccd2da}figure a{display:block;margin:8px 0}#loading{display:none;padding:10px;color:#245bb0}[hidden]{display:none!important}
</style>
</head>
<body>
<h1>提取印章</h1>
<p class="muted">纯前端 · 图片不上传 · 实验归档版</p>
<p role="note" style="padding:12px;border:1px solid #c58925;background:#fff3d8;border-radius:7px"><strong>已知问题：</strong>彩色椭圆章模式经用户验证，仍残留背景文字，效果未达可用标准。本次仅归档实验进度，不代表问题已解决。默认仍为原版红色圆章模式。</p>
<fieldset id="controls">
<legend>提取设置</legend>
<div class="row"><label for="mode">模式</label><select id="mode"><option value="legacy">原版红色圆章（算法不变）</option><option value="ellipse">自定义颜色 / 椭圆章（实验未通过）</option></select></div>
<p id="modeHelp" class="muted"></p>
<div id="colorOptions" hidden>
<div class="row"><label for="sourceColor">提取颜色</label><input id="sourceColor" type="color" value="#5c505b" aria-label="提取颜色选择器"><input id="sourceHex" type="text" value="#5c505b" aria-label="提取颜色十六进制" maxlength="7"><button id="pickButton" type="button">从原图取色</button></div>
<div class="row"><label for="tolerance">色相容差 ±</label><input id="tolerance" type="number" min="2" max="60" value="42"><span>度</span><label for="minSaturation">去灰阈值</label><input id="minSaturation" type="number" min="1" max="50" value="5"><span>% 饱和度</span></div>
<p class="muted">这张灰紫章可从 42° / 5% 开始，鲜艳蓝章建议缩小到 20° 左右。缺笔时适当放宽容差或降低去灰阈值；杂色较多时反向调整。不能区分同色的非印章内容。</p>
<div class="row"><label for="outputMode">输出</label><select id="outputMode"><option value="original">保留照片中的原色</option><option value="custom">统一为自定义颜色</option></select><input id="outputColor" type="color" value="#635076" aria-label="输出颜色选择器"><input id="outputHex" type="text" value="#635076" aria-label="输出颜色十六进制" maxlength="7"></div>
</div>
<div class="row"><label for="imageInput">图片</label><input type="file" id="imageInput" accept="image/*" onchange="selectImage()" disabled><button id="processButton" type="button" disabled>重新提取</button></div>
<p id="fileName" class="muted"></p>
</fieldset>
<p id="status" role="status">正在加载 OpenCV，请稍候（最多 30 秒）…</p>
<div id="loading">处理中，请稍候…</div>
<h2>提取结果</h2><div id="imageContainer"></div>
<h2>原图 / 点击取色</h2><p class="muted">点击“从原图取色”后，在清晰的印章边框上点一下；避免黑字、纸张和马赛克。</p>
<div id="originalImageContainer"><canvas id="sourceCanvas" hidden aria-label="原图取色画布"></canvas></div>
<script src="./app.js" onerror="document.getElementById('status').textContent='页面脚本加载失败，请确保 app.js 与页面位于同一文件夹。'"></script>
</body>
</html>
